name: Android APK Build

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm APKs and run checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build installable release-variant APKs and run checks
        shell: bash
        run: |
          set +e
          ./gradlew --console=plain --stacktrace :app:assembleRelease-with-debug-signing test ktlintCheck 2>&1 | tee gradle-build.log
          gradle_status=${PIPESTATUS[0]}
          if [ "$gradle_status" -ne 0 ]; then
            diagnostics="$(sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log)"
            if [ -z "$diagnostics" ]; then
              diagnostics="$(grep -E '(^e: |^> Task .* FAILED|Execution failed for task|^FAILURE:|^\* What went wrong:|^A problem occurred|^Could not|^Caused by:|^>)' gradle-build.log | tail -n 40)"
            fi
            {
              echo '## Gradle failure diagnostics'
              echo '```text'
              printf '%s\n' "$diagnostics"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              echo "::error title=Gradle failure::$escaped"
            done <<< "$diagnostics"
            exit "$gradle_status"
          fi

      - name: Prepare release APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release-with-debug-signing/app-arm64-v8a-release-with-debug-signing.apk \
            dist/NextPlayer-arm64-v8a.apk
          cp app/build/outputs/apk/release-with-debug-signing/app-armeabi-v7a-release-with-debug-signing.apk \
            dist/NextPlayer-armeabi-v7a.apk
          cp app/build/outputs/apk/release-with-debug-signing/app-universal-release-with-debug-signing.apk \
            dist/NextPlayer-universal.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle reports and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports
          path: |
            gradle-build.log
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextplayer-apks
          path: dist

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Next Player Convx Navigation ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/NextPlayer-arm64-v8a.apk
            dist/NextPlayer-armeabi-v7a.apk
            dist/NextPlayer-universal.apk
            dist/SHA256SUMS.txt
