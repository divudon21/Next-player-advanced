name: Android APK Build

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm APKs and run checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build installable release-variant APKs and run checks
        run: ./gradlew :app:assembleReleaseWithDebugSigning test ktlintCheck

      - name: Prepare release APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release-with-debug-signing/app-arm64-v8a-release-with-debug-signing.apk \
            dist/NextPlayer-arm64-v8a.apk
          cp app/build/outputs/apk/release-with-debug-signing/app-armeabi-v7a-release-with-debug-signing.apk \
            dist/NextPlayer-armeabi-v7a.apk
          cp app/build/outputs/apk/release-with-debug-signing/app-universal-release-with-debug-signing.apk \
            dist/NextPlayer-universal.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextplayer-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextplayer-apks
          path: dist

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Next Player Liquid Glass ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/NextPlayer-arm64-v8a.apk
            dist/NextPlayer-armeabi-v7a.apk
            dist/NextPlayer-universal.apk
            dist/SHA256SUMS.txt
